# 复制成 config.yaml 后填写（真实密钥不要上传到代码仓库）
# ── 机器人凭据：QQ 开放平台 → 机器人 → 开发设置 ──
# 两个都留空，填到面板里即可。这里不要填示例值，
# 否则面板轮询时会把示例值回填到输入框，把你正在输入的内容冲掉。
appid: ""
secret: ""

# 沙箱环境：调试期建议先 true（只对你配置的沙箱群生效），正式使用改 false
is_sandbox: false

# ── 沙盒群（测试专用）──
# 指定一个群的 ID，拿来专门试东西：设了之后面板的「📤 发条测试」
# 会直接发到这个群，不用每次去选。适合用小群当试验田，
# 避免测试消息打扰正式群。留空 = 不启用。
# 群 ID 在面板「💖 订阅」里能看到；群要先在群里 @ 一下机器人登记。
sandbox_group: ""

# ── 检查频率 ──
# 直播状态检查间隔（秒），建议 60 起步，太快容易被 B 站限流
# 轮询间隔（秒）。自适应：贴着风控边缘跑，撞风控自动放慢，稳定后自动加快。
# 默认 12 秒（较快，准秒级）；最快档 8 秒；撞风控最多放到 120 秒。
# 消息样式：
#   markdown = 卡片（需要申请自定义 Markdown 权限）
#   text     = 纯文本（一定可用，用 Unicode 符号排版）
message_style: markdown

poll_interval: 12
poll_interval_min: 8
poll_interval_max: 120
# 投稿和动态变化慢：每 N 轮才查一次（60 × 3 = 3 分钟查一次）
slow_check_every: 1
request_timeout: 10
min_request_interval: 2.0

# ── 提醒行为 ──
# 下播时是否也提醒一条（默认关）
notify_offline: false
# 提醒里是否带图片（直播封面 / 视频封面 / 动态插图）
send_image: true

# ── 可选 ──
# B 站 Cookie：不填也能用；如果动态/投稿接口经常失败，把浏览器的 SESSDATA 填进来更稳
# ---- 权限 ----
# **只让群主 / 管理员使用指令**，没有名单兜底。
# 普通人 @ 机器人或发指令，机器人**完全不理**（不给任何回复）。
# 前提：机器人要能调用官方「获取群成员」接口
# （GET /v2/groups/{group_openid}/members/{member_openid}，角色在 member_role 字段）。
# ⚠️ 没开通该接口的话谁都用不了（包括群主）——
# 群里发「/我的ID」，若「群内角色」显示"未知"即为此情况。

# 只推送 UP 主本人的置顶评论（粉丝刷上去的不算）
top_comment_only_up: true
# 去重窗口（秒）：开播/投稿时 B 站会自动发一条对应动态，
# 在这个时间窗内的同类型重复动态会被静默，避免提醒两次。
# 直播预约动态不受影响，始终提醒。
dedupe_window: 900
# 开播/投稿后紧跟着的那条动态要不要静默（true = 静默）。
# B 站自动发的开播动态不一定带直播间卡片（有的版本只有纯文字），
# 这时按「刚推过开播提醒 + 动态发布时间不早于它」兜底判定。
# ⚠️ 副作用：UP 主直播期间手发的普通动态也会被一并吞掉，
#    介意的话设成 false（只保留按直播间号/视频号的精确去重）。
silence_dyn_after_push: true
# 中文翻译：日志里的英文术语（类名/方法名/B站错误码）翻成中文白话。
# 关掉则只看原始日志（排查代码级问题时更有用）。
log_translate: true
# 输出调试日志：开 → DEBUG 级细节也写进 bot.log（排查用，日志会长得很快）；
# 关 → 只记 INFO 及以上。面板「设置 → 高级」里可改，改完不用重启。
log_debug: false

bili_cookie: ""
# 网页管理面板的访问口令，留空则不需要登录（部署到公网时强烈建议设置）
web_password: ""

# ── 文案模板 ──
# 变量：{name} = UP 主昵称，{title} = 标题。留空则用默认文案。
templates:
  live: '【直播订阅】"{name}"开播啦！记得看噢~'
  video: '【视频订阅】"{name}"新视频投稿了《{title}》，记得看噢~'
  dynamic: '【动态订阅】"{name}"新动态更新了《{title}》'
  dynamic_no_title: '【动态订阅】"{name}"新动态更新了'
  offline: '【直播订阅】"{name}"已下播啦~'

# 数据文件（SQLite）。默认 data.db，一般不用改
data_file: "data.db"

# 图片怎么出现在群里
#   inline 图片内嵌在卡片里（![](url) 随卡片一起发，群里只有一条消息）【默认】
#   local  本地下载后 base64 直传，图单独发一条、卡片里不再带图
#   url    把图片链接交给平台下载转存（同样单独发一条）
#   auto   先 local，失败退 url（同样单独发一条）
#   off    不发图片
image_send_mode: inline
# 内嵌模式（inline）下卡片里的图要压到多宽。默认 0 = **不压缩、用原图**。
# ⚠️ 不管压不压，格式都会统一成 jpg（B站图床默认给 webp，手机 QQ 支持差）。
# 想压就设成 672（16:9，B站标准参数），原图动辄 1920×1080 好几 MB，
# 手机端加载大图可能失败——压了更稳，代价是画质会糊。
# 改完热更新生效，不用重启机器人。
image_inline_width: 0
# 推送用的封面图下载到本地后保留多久（秒），默认 300（5 分钟）。
# 同一张封面连发几个群 / 失败重试时不用反复去 B 站下载。
# 设 0 = 发完立刻删（省磁盘，但每发一个群都要重下一次图）。
image_tmp_ttl: 300
